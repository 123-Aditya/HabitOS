<mat-sidenav-container class="layout-container">

  <!-- Sidebar -->
  <mat-sidenav
    #drawer
    mode="side"
    opened
    class="sidenav">

    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>

    <app-navbar (menuToggle)="drawer.toggle()"></app-navbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
