<div class="dashboard-wrapper">

  <div class="dashboard-header">
    <h1>👋 Welcome back, Aditya</h1>
    <br>
  </div>

  <!-- Date Filter Section -->
<div class="filter-section">

  <div class="date-group">
    <label>From</label>
    <input type="date" [(ngModel)]="fromDate">
  </div>

  <div class="date-group">
    <label>To</label>
    <input type="date" [(ngModel)]="toDate">
  </div>

  <button
    class="apply-btn"
    (click)="loadDashboard()"
    [disabled]="!fromDate || !toDate">
    Apply
  </button>

</div>

  <div *ngIf="loading" class="loading">
    Loading dashboard...
  </div>

  <div *ngIf="!loading">

    <!-- Stats Cards -->
    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-value">{{ totalHabits }}</div>
        <div class="stat-label">Active Habits</div>
      </div>

      <div class="stat-card highlight">
        <div class="stat-value">{{ completionPercentage }}%</div>
        <div class="stat-label">Today's Completion</div>
      </div>

      <div class="stat-card">
        <div class="stat-value">{{ totalEntries }}</div>
        <div class="stat-label">Entries Logged Today</div>
      </div>

    </div>

    <!-- Habit Progress List -->
    <div class="habit-section" *ngIf="data?.habits?.length">

      <h2>Your Habits</h2>

      <div class="habit-card" *ngFor="let habit of data.habits">

        <div class="habit-header">
          <h3>{{ habit.habitName }}</h3>
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            [style.width.%]="habit.progress?.length ? 100 : 0">
          </div>
        </div>

        <div class="progress-label">
          {{ habit.progress?.length ? 'Completed Today ✅' : 'Not Completed ❌' }}
        </div>

      </div>

    </div>

  </div>

</div>
